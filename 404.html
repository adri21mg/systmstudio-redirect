<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Systm is now NullOffset. Visit nulloffset.com.">
  <title>Systm is now NullOffset</title>
  <link rel="canonical" href="https://nulloffset.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #101110; --text: #eceee8; --muted: #a0a39b; --accent: #d3dfa1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    main { width: calc(100% - 48px); max-width: 620px; padding-block: 64px; }
    img { display: block; width: 300px; max-width: 100%; height: auto; margin-bottom: 56px; }
    h1 { margin: 0 0 20px; font-size: clamp(34px, 7vw, 56px); line-height: 1.05; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 18px; }
    a.cta { display: inline-block; margin-top: 24px; padding: 14px 26px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 18px; }
    a.cta:hover, a.cta:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  </style>
</head>
<body>
  <main>
    <img src="nulloffset.svg" width="2061" height="358" alt="NullOffset">
    <h1>We’ve changed the name!</h1>
    <p>After some bureaucratic stuff, we found out that Systm was already taken, so we had to change the name.</p>
    <p>Same studio, same games, new name.</p>
    <a class="cta" href="https://nulloffset.com/">Go to nulloffset.com ↗</a>
  </main>
</body>
</html>
